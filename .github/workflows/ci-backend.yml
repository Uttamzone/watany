name: CI backend

on:
  push:
    branches: [main]
    paths:
      - 'watani-b2c-service/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'watani-b2c-service/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watani-b2c-service
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: watani_b2c_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: watani-b2c-service/pom.xml

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/watani_b2c_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: mvn --batch-mode verify

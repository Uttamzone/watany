apiVersion: v1
kind: ConfigMap
metadata:
  name: watani-backend-config
  namespace: watani
data:
  # Tuned for the 3.7GB shared host: 10 max (was 20) matches the DB's max_connections=40
  # (pool + admin/migration/backup headroom); minimumIdle lets it shrink under low traffic
  # instead of holding 10 idle connections open at all times.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
  SPRING_FLYWAY_REPAIR_ON_MIGRATE: "true"
  SPRING_FLYWAY_OUT_OF_ORDER: "true"
  SPRING_JMX_ENABLED: "false"
  SPRING_DATASOURCE_DRIVER: "org.postgresql.Driver"

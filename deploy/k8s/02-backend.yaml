apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: watani-uploads
  namespace: watani
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watani-b2c-service
  namespace: watani
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 5
  selector:
    matchLabels:
      app: watani-b2c-service
  template:
    metadata:
      labels:
        app: watani-b2c-service
    spec:
      containers:
        - name: watani-b2c-service
          image: watani-b2c-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
          envFrom:
            - configMapRef:
                name: watani-backend-config
            - secretRef:
                name: watani-db-credentials
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keeps accepting connections briefly so Traefik's endpoint removal can propagate first.
              exec:
                command: ["sh", "-c", "sleep 2"]
      terminationGracePeriodSeconds: 15
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: watani-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: watani-b2c-service
  namespace: watani
spec:
  selector:
    app: watani-b2c-service
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: watani-uploads
  namespace: watani
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watani-b2c-service
  namespace: watani
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 5
  selector:
    matchLabels:
      app: watani-b2c-service
  template:
    metadata:
      labels:
        app: watani-b2c-service
    spec:
      containers:
        - name: watani-b2c-service
          image: watani-b2c-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # SerialGC + capped metaspace/code-cache/stack: low fixed overhead for a small single node.
            # MaxDirectMemorySize is explicit because it otherwise defaults to matching -Xmx
            # (~538Mi here) - an unbounded-in-practice extra allowance on top of heap that this
            # REST API (no heavy NIO/streaming workload) has no real need for; 64m matches the
            # code-cache budget and closes off the single largest un-capped risk to the container limit.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:+UseSerialGC
                -XX:MaxRAMPercentage=70
                -XX:MaxMetaspaceSize=160m
                -XX:ReservedCodeCacheSize=64m
                -XX:MaxDirectMemorySize=64m
                -Xss768k
                -XX:+ExitOnOutOfMemoryError
          envFrom:
            - configMapRef:
                name: watani-backend-config
            - secretRef:
                name: watani-db-credentials
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keeps accepting connections briefly so Traefik's endpoint removal can propagate first.
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 40
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: watani-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: watani-b2c-service
  namespace: watani
spec:
  selector:
    app: watani-b2c-service
  ports:
    - port: 8080
      targetPort: 8080

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" role="img" aria-label="Watani and Sons hamper of Palestinian products" width="500" height="460">
<title>Watani and Sons hamper of Palestinian products</title>

<defs>
<linearGradient id="crate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9bd86"/><stop offset="1" stop-color="#b2924f"/></linearGradient>
<linearGradient id="tin2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8b34a"/><stop offset=".45" stop-color="#f2d888"/><stop offset="1" stop-color="#b8912f"/></linearGradient>
<linearGradient id="btl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a6a35"/><stop offset=".45" stop-color="#82a95a"/><stop offset="1" stop-color="#3d5a2b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a9eb5a" stop-opacity=".28"/><stop offset="1" stop-color="#a9eb5a" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="270" cy="230" r="210" fill="url(#glow)"/>

<!-- back row: olive oil tins -->
<g transform="translate(96,96)">
  <rect x="0" y="30" width="96" height="118" rx="8" fill="url(#tin2)" stroke="#8d6d1f" stroke-width="2"/>
  <rect x="34" y="6" width="28" height="26" rx="5" fill="#b8912f"/>
  <rect x="12" y="52" width="72" height="74" rx="6" fill="#fffaf0"/>
  <rect x="12" y="52" width="72" height="20" rx="6" fill="#00504c"/>
  <text x="48" y="66" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="800" fill="#fff">WATANY</text>
  <path d="M34 96 q14 -20 28 -8 q-12 16 -28 8z" fill="#6f9a3f"/>
</g>

<!-- olive oil bottle -->
<g transform="translate(226,64)">
  <path d="M20 60 q0 -12 6 -17 l0 -28 q0 -7 7 -7 l16 0 q7 0 7 7 l0 28 q6 5 6 17 l0 128 q0 18 -18 18 l-6 0 q-18 0 -18 -18z" fill="url(#btl)"/>
  <rect x="30" y="6" width="22" height="13" rx="3" fill="#00403d"/>
  <rect x="16" y="98" width="50" height="62" rx="5" fill="#fffaf0"/>
  <rect x="16" y="98" width="50" height="17" rx="5" fill="#00504c"/>
  <text x="41" y="111" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="9" font-weight="800" fill="#fff">WATANY</text>
  <path d="M30 134 q11 -15 22 -6 q-9 13 -22 6z" fill="#6f9a3f"/>
</g>

<!-- zaatar pouch -->
<g transform="translate(320,140)">
  <path d="M0 20 l86 0 l0 120 q0 14 -14 14 l-58 0 q-14 0 -14 -14z" fill="#5c8a37"/>
  <path d="M0 20 l86 0 l-6 -14 l-74 0z" fill="#3d6224"/>
  <rect x="12" y="46" width="62" height="72" rx="7" fill="#fffaf0"/>
  <text x="43" y="72" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f5c1c">ZAATAR</text>
  <circle cx="43" cy="94" r="14" fill="#eef6e2"/>
  <path d="M34 98 q9 -14 18 -6 q-8 11 -18 6z" fill="#6f9a3f"/>
</g>

<!-- olive jar -->
<g transform="translate(78,208)">
  <rect x="0" y="20" width="76" height="112" rx="16" fill="#bcd79c" opacity=".92"/>
  <rect x="6" y="0" width="64" height="22" rx="6" fill="#00504c"/>
  <ellipse cx="18" cy="50" rx="11" ry="9" fill="#6f9a3f"/><ellipse cx="40" cy="50" rx="11" ry="9" fill="#6f9a3f"/><ellipse cx="62" cy="50" rx="11" ry="9" fill="#6f9a3f"/><ellipse cx="18" cy="82" rx="11" ry="9" fill="#6f9a3f"/><ellipse cx="40" cy="82" rx="11" ry="9" fill="#6f9a3f"/><ellipse cx="62" cy="82" rx="11" ry="9" fill="#6f9a3f"/>
</g>

<!-- cheese pail -->
<g transform="translate(186,224)">
  <path d="M6 22 l84 0 l-8 108 q0 12 -13 12 l-42 0 q-13 0 -13 -12z" fill="#f2f5f0" stroke="#cfd8ca" stroke-width="2"/>
  <rect x="0" y="6" width="96" height="20" rx="7" fill="#e8ede6" stroke="#c3ccbf" stroke-width="2"/>
  <rect x="20" y="46" width="56" height="52" rx="7" fill="#00504c"/>
  <text x="48" y="70" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="9" font-weight="800" fill="#fff">NABULSI</text>
  <text x="48" y="86" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="8" font-weight="700" fill="#a9eb5a">CHEESE</text>
</g>

<!-- ceramic bowl -->
<g transform="translate(300,286)">
  <path d="M0 10 q52 20 104 0 q-8 62 -52 62 q-44 0 -52 -62z" fill="#f4f8fb" stroke="#cfdce6" stroke-width="2"/>
  <path d="M0 10 q52 20 104 0 q-1 10 -3 17 q-49 18 -98 0 q-2 -7 -3 -17z" fill="#0b4b83" opacity=".8"/>
</g>

<!-- crate front -->
<path d="M40 300 l420 0 l-26 118 q-3 22 -25 22 l-318 0 q-22 0 -25 -22z" fill="url(#crate)"/>
<rect x="34" y="288" width="432" height="26" rx="9" fill="#c8ad76" stroke="#a8905f" stroke-width="2"/>
<rect x="150" y="336" width="200" height="58" rx="10" fill="#00504c"/>
<text x="250" y="365" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffffff">WATANI</text>
<text x="250" y="384" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" fill="#a9eb5a" letter-spacing="3">&amp; SONS</text>

</svg>